<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geeta University – Digital Twin</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#06090f;--bg2:#0c1420;--border:#1e3855;--primary:#00c8ff;--pglow:rgba(0,200,255,.25);--green:#22dd77;--yellow:#ffcc22;--red:#ff4455;--text:#b8ccd8;--dim:#4a6a8a;--font-h:'Rajdhani',sans-serif;--font-m:'Share Tech Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-h);height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
/* ---- HEADER ---- */
header{display:flex;align-items:center;gap:14px;padding:8px 18px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#00c8ff,#0055ff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.logo-text h1{font-size:17px;font-weight:700;color:#fff;letter-spacing:1px;text-transform:uppercase}
.logo-text p{font-size:9px;color:var(--primary);letter-spacing:2px;font-family:var(--font-m)}
.hcenter{flex:1;display:flex;justify-content:center}
.sw{position:relative;width:360px}
.sb{display:flex;align-items:center;background:#0e1828;border:1px solid var(--border);border-radius:8px;padding:5px 12px;gap:8px;transition:.2s}
.sb:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px var(--pglow)}
.sb input{background:none;border:none;outline:none;color:#fff;font-family:var(--font-h);font-size:14px;width:100%}
.sb input::placeholder{color:var(--dim)}
.sr{position:absolute;top:100%;left:0;right:0;background:#0e1828;border:1px solid var(--primary);border-top:none;border-radius:0 0 8px 8px;z-index:300;max-height:220px;overflow-y:auto;display:none}
.sri{padding:7px 12px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border);transition:.15s}
.sri:last-child{border-bottom:none}
.sri:hover{background:rgba(0,200,255,.1);color:var(--primary)}
.sri-sub{font-size:10px;color:var(--dim);font-family:var(--font-m)}
.hright{display:flex;gap:8px;align-items:center}
.btn{padding:5px 13px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);font-family:var(--font-h);font-size:13px;cursor:pointer;transition:.2s;letter-spacing:.5px}
.btn:hover{border-color:var(--primary);color:var(--primary);background:var(--pglow)}
.btn.active{background:var(--primary);color:#000;border-color:var(--primary);font-weight:700}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);font-family:var(--font-m)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
/* ---- MAIN ---- */
.main{flex:1;display:flex;overflow:hidden}
.mc{flex:1;position:relative;overflow:hidden;cursor:grab}
.mc:active{cursor:grabbing}
.mc::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(0,200,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.02) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0}
#cmap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;max-width:100%;max-height:100%}
/* ---- BUILDINGS ---- */
.b{cursor:pointer}
.b *{transition:.2s}
.b:hover .bf{filter:brightness(1.5) drop-shadow(0 0 6px currentColor)}
.b.sel .bf{filter:brightness(1.8) drop-shadow(0 0 10px currentColor)}
.b.hi .bf{filter:brightness(2.2) drop-shadow(0 0 12px #fff);animation:hipulse 1s ease-in-out infinite}
@keyframes hipulse{0%,100%{opacity:1}50%{opacity:.5}}
/* ---- SIDEBAR ---- */
.side{width:0;background:var(--bg2);border-left:1px solid var(--border);overflow:hidden;transition:width .28s ease;display:flex;flex-direction:column;flex-shrink:0}
.side.open{width:310px}
.sc{width:310px;padding:18px;overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.bhead{display:flex;align-items:flex-start;gap:11px;margin-bottom:14px}
.bico{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.bmeta h2{font-size:17px;font-weight:700;color:#fff;line-height:1.2;margin-bottom:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-family:var(--font-m)}
.is{margin-bottom:12px}
.is h3{font-size:10px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-family:var(--font-m)}
.ir{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(30,56,85,.4);font-size:13px}
.ir:last-child{border-bottom:none}
.ir .ico{width:16px;text-align:center;opacity:.7}
.ir .lbl{color:var(--dim);min-width:80px;font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{padding:2px 9px;border-radius:20px;border:1px solid var(--border);font-size:10px;color:var(--dim);font-family:var(--font-m)}
.div{height:1px;background:var(--border);margin:14px 0}
.navbtn{width:100%;padding:10px;background:linear-gradient(135deg,var(--primary),#0055ff);border:none;border-radius:8px;color:#000;font-family:var(--font-h);font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:.2s}
.navbtn:hover{opacity:.85}
.xbtn{position:absolute;top:8px;right:8px;background:none;border:1px solid var(--border);color:var(--dim);border-radius:4px;width:22px;height:22px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:5}
/* ---- BOTTOM BAR ---- */
.bbar{height:34px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:22px;flex-shrink:0;font-size:11px;color:var(--dim);font-family:var(--font-m)}
.stat span{color:var(--primary)}
/* ---- TOOLTIP ---- */
.tip{position:absolute;background:rgba(12,20,32,.97);border:1px solid var(--primary);border-radius:6px;padding:5px 11px;font-size:12px;color:#fff;pointer-events:none;z-index:200;transform:translate(-50%,-100%) translateY(-10px);white-space:nowrap;font-family:var(--font-h);box-shadow:0 0 10px var(--pglow);display:none}
/* ---- LEGEND ---- */
.leg{position:absolute;bottom:10px;left:10px;background:rgba(12,20,32,.92);border:1px solid var(--border);border-radius:8px;padding:10px 13px;z-index:10;pointer-events:none}
.leg h4{color:var(--dim);font-family:var(--font-m);letter-spacing:1px;margin-bottom:7px;font-size:9px;text-transform:uppercase}
.li{display:flex;align-items:center;gap:7px;margin-bottom:4px;color:var(--dim);font-size:11px}
.lc{width:13px;height:9px;border-radius:2px}
/* ---- ZOOM CTRL ---- */
.zc{position:absolute;bottom:10px;right:10px;display:flex;flex-direction:column;gap:5px;z-index:10}
.zb{width:34px;height:34px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;font-family:var(--font-h)}
.zb:hover{border-color:var(--primary);color:var(--primary)}
/* ---- NAV PANEL ---- */
.np{position:absolute;top:10px;left:10px;background:rgba(12,20,32,.97);border:1px solid var(--border);border-radius:8px;padding:13px;z-index:20;width:250px;display:none}
.np.show{display:block}
.np h4{font-size:11px;color:var(--primary);letter-spacing:1px;text-transform:uppercase;font-family:var(--font-m);margin-bottom:9px}
.ns{width:100%;background:var(--bg);border:1px solid var(--border);color:#fff;font-family:var(--font-h);padding:5px 9px;border-radius:6px;font-size:12px;margin-bottom:7px;outline:none}
.ns:focus{border-color:var(--primary)}
.ri{margin-top:9px;padding:7px 9px;background:rgba(34,221,119,.05);border:1px solid rgba(34,221,119,.2);border-radius:6px;font-size:11px;color:var(--green);font-family:var(--font-m);display:none;line-height:1.7}
/* ---- ROUTE ---- */
.rp{stroke:#22dd77;stroke-width:4;stroke-dasharray:12 6;fill:none;animation:dash 1s linear infinite;filter:drop-shadow(0 0 5px #22dd77)}
@keyframes dash{to{stroke-dashoffset:-18}}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🏛️</div>
    <div class="logo-text">
      <h1>Geeta University</h1>
      <p>Digital Twin · Campus Navigator</p>
    </div>
  </div>
  <div class="hcenter">
    <div class="sw">
      <div class="sb"><span style="opacity:.5">⌕</span>
        <input type="text" id="sinp" placeholder="Search buildings, labs, hostels…" autocomplete="off">
      </div>
      <div class="sr" id="sres"></div>
    </div>
  </div>
  <div class="hright">
    <div class="live"><div class="dot"></div>LIVE MAP</div>
    <button class="btn" id="navBtn" onclick="toggleNav()">⇨ Navigate</button>
    <button class="btn" onclick="resetView()">⊙ Reset</button>
  </div>
</header>

<div class="main">
  <div class="mc" id="mc">
    <div class="tip" id="tip"></div>

    <div class="leg">
      <h4>Legend</h4>
      <div class="li"><div class="lc" style="background:#1a3a6a;border:1px solid #4488ff"></div>Academic Block</div>
      <div class="li"><div class="lc" style="background:#3a0a3a;border:1px solid #cc44aa"></div>Hostel</div>
      <div class="li"><div class="lc" style="background:#0a1e0a;border:1px solid #22aa44"></div>Ground / Sports</div>
      <div class="li"><div class="lc" style="background:#2a1e06;border:1px solid #cc9922"></div>Parking</div>
      <div class="li"><div class="lc" style="background:#3a0a0a;border:1px solid #cc3333"></div>Admin / Security</div>
      <div class="li"><div class="lc" style="background:#1e0a2e;border:1px solid #8844cc"></div>Amenity</div>
    </div>

    <div class="zc">
      <button class="zb" onclick="zIn()" title="Zoom In">＋</button>
      <button class="zb" onclick="zOut()" title="Zoom Out">－</button>
      <button class="zb" onclick="resetView()" title="Reset">⊙</button>
    </div>

    <div class="np" id="np">
      <h4>🧭 Route Planner</h4>
      <label style="font-size:10px;color:var(--dim)">From:</label>
      <select class="ns" id="nfrom"></select>
      <label style="font-size:10px;color:var(--dim)">To:</label>
      <select class="ns" id="nto"></select>
      <button class="btn" style="width:100%;margin-top:5px" onclick="doRoute()">Show Route</button>
      <div class="ri" id="rinfo"></div>
    </div>

    <!-- ======================== SVG MAP ======================== -->
    <svg id="cmap" viewBox="0 0 1620 800" xmlns="http://www.w3.org/2000/svg" style="width:96%;height:93%">
      <rect width="1620" height="800" fill="#080d14"/>

      <!-- COMPASS -->
      <g transform="translate(1575,58)">
        <circle r="26" fill="rgba(12,20,32,.85)" stroke="#1e3855" stroke-width="1"/>
        <text y="-12" text-anchor="middle" fill="#00c8ff" font-size="11" font-family="Rajdhani" font-weight="700">N</text>
        <text y="18" text-anchor="middle" fill="#4a6a8a" font-size="9" font-family="Rajdhani">S</text>
        <text x="-16" y="5" text-anchor="middle" fill="#4a6a8a" font-size="9" font-family="Rajdhani">W</text>
        <text x="16" y="5" text-anchor="middle" fill="#4a6a8a" font-size="9" font-family="Rajdhani">E</text>
        <polygon points="0,-18 3,-6 0,-2 -3,-6" fill="#00c8ff"/>
        <polygon points="0,18 3,6 0,2 -3,6" fill="#4a6a8a"/>
      </g>

      <!-- SCALE -->
      <g transform="translate(55,765)" opacity=".7">
        <line x1="0" y1="0" x2="100" y2="0" stroke="#4a6a8a" stroke-width="2"/>
        <line x1="0" y1="-4" x2="0" y2="4" stroke="#4a6a8a" stroke-width="2"/>
        <line x1="100" y1="-4" x2="100" y2="4" stroke="#4a6a8a" stroke-width="2"/>
        <text x="50" y="-6" text-anchor="middle" fill="#4a6a8a" font-size="9" font-family="Share Tech Mono">~150m</text>
      </g>

      <!-- ======= ROADS ======= -->
      <!-- Main campus road horizontal -->
      <rect x="0" y="375" width="1620" height="42" fill="#141824" rx="1"/>
      <line x1="0" y1="395" x2="1620" y2="395" stroke="#24283a" stroke-width="1" stroke-dasharray="20,10"/>
      <line x1="0" y1="376" x2="1620" y2="376" stroke="#303450" stroke-width="1.5"/>
      <line x1="0" y1="416" x2="1620" y2="416" stroke="#303450" stroke-width="1.5"/>
      <text x="800" y="392" text-anchor="middle" fill="#2a2e44" font-size="10" font-family="Share Tech Mono" letter-spacing="3">MAIN CAMPUS ROAD</text>

      <!-- Internal north road (to football ground) -->
      <rect x="532" y="0" width="46" height="378" fill="#141824"/>
      <line x1="555" y1="0" x2="555" y2="376" stroke="#24283a" stroke-width="1" stroke-dasharray="18,9"/>
      <line x1="533" y1="0" x2="533" y2="376" stroke="#303450" stroke-width="1.5"/>
      <line x1="577" y1="0" x2="577" y2="376" stroke="#303450" stroke-width="1.5"/>

      <!-- ======= WEST ENTRANCE ======= -->
      <!-- Gate west -->
      <rect x="12" y="368" width="10" height="54" fill="#cc2222" rx="1"/>
      <rect x="12" y="390" width="36" height="7" fill="#991111" rx="1"/>
      <text x="17" y="362" text-anchor="middle" fill="#ff4455" font-size="8" font-family="Share Tech Mono">GATE</text>
      <!-- Gate east -->
      <rect x="1598" y="368" width="10" height="54" fill="#cc2222" rx="1"/>
      <text x="1603" y="362" text-anchor="middle" fill="#ff4455" font-size="8" font-family="Share Tech Mono">EXIT</text>

      <!-- Roundabout/Oval -->
      <ellipse cx="210" cy="396" rx="55" ry="20" fill="#1a2234" stroke="#2a3a5a" stroke-width="1.5"/>
      <ellipse cx="210" cy="396" rx="28" ry="10" fill="#0c1420" stroke="#223050" stroke-width="1"/>

      <!-- Ghangas Medical label -->
      <text x="28" y="440" fill="#4a6a8a" font-size="10" font-family="Share Tech Mono">⊕ Ghangas Medical</text>

      <!-- ======= OUT POST ======= -->
      <g class="b" data-id="outpost" onclick="selB('outpost')" onmouseenter="showTip(event,'Out Post – Security Check')" onmouseleave="hideTip()">
        <rect class="bf" x="512" y="362" width="48" height="54" fill="#4a0a0a" stroke="#cc3333" stroke-width="2" rx="3"/>
        <rect x="522" y="372" width="28" height="18" fill="#6a1212" rx="2"/>
        <text x="536" y="400" text-anchor="middle" fill="#ff5566" font-size="9" font-family="Share Tech Mono">OUT</text>
        <text x="536" y="411" text-anchor="middle" fill="#ff5566" font-size="9" font-family="Share Tech Mono">POST</text>
        <circle cx="536" cy="424" r="4" fill="#ff4455" opacity=".8"/>
      </g>

      <!-- ======= NORTH ZONE ======= -->

      <!-- Parking A (NW) -->
      <g class="b" data-id="parking-a" onclick="selB('parking-a')" onmouseenter="showTip(event,'Parking Zone A')" onmouseleave="hideTip()">
        <rect class="bf" x="70" y="195" width="200" height="162" fill="#221808" stroke="#cc9922" stroke-width="1.5" stroke-dasharray="7,4" rx="3"/>
        <line x1="100" y1="205" x2="100" y2="350" stroke="#cc9922" stroke-width=".8" opacity=".35"/>
        <line x1="126" y1="205" x2="126" y2="350" stroke="#cc9922" stroke-width=".8" opacity=".35"/>
        <line x1="152" y1="205" x2="152" y2="350" stroke="#cc9922" stroke-width=".8" opacity=".35"/>
        <line x1="178" y1="205" x2="178" y2="350" stroke="#cc9922" stroke-width=".8" opacity=".35"/>
        <line x1="204" y1="205" x2="204" y2="350" stroke="#cc9922" stroke-width=".8" opacity=".35"/>
        <line x1="230" y1="205" x2="230" y2="350" stroke="#cc9922" stroke-width=".8" opacity=".35"/>
        <text x="170" y="283" text-anchor="middle" fill="#cc9922" font-size="15" font-family="Rajdhani" font-weight="700">Parking</text>
        <text x="170" y="300" text-anchor="middle" fill="#cc9922" font-size="11" font-family="Share Tech Mono">ZONE A</text>
        <text x="170" y="335" text-anchor="middle" fill="#cc9922" font-size="26" font-family="Rajdhani" font-weight="700">P</text>
      </g>

      <!-- Parking B (N center) -->
      <g class="b" data-id="parking-b" onclick="selB('parking-b')" onmouseenter="showTip(event,'Parking Zone B')" onmouseleave="hideTip()">
        <rect class="bf" x="285" y="215" width="200" height="145" fill="#221808" stroke="#cc9922" stroke-width="1.5" stroke-dasharray="7,4" rx="3"/>
        <line x1="310" y1="225" x2="310" y2="354" stroke="#cc9922" stroke-width=".8" opacity=".35"/>
        <line x1="336" y1="225" x2="336" y2="354" stroke="#cc9922" stroke-width=".8" opacity=".35"/>
        <line x1="362" y1="225" x2="362" y2="354" stroke="#cc9922" stroke-width=".8" opacity=".35"/>
        <line x1="388" y1="225" x2="388" y2="354" stroke="#cc9922" stroke-width=".8" opacity=".35"/>
        <line x1="414" y1="225" x2="414" y2="354" stroke="#cc9922" stroke-width=".8" opacity=".35"/>
        <line x1="440" y1="225" x2="440" y2="354" stroke="#cc9922" stroke-width=".8" opacity=".35"/>
        <text x="385" y="294" text-anchor="middle" fill="#cc9922" font-size="15" font-family="Rajdhani" font-weight="700">Parking</text>
        <text x="385" y="311" text-anchor="middle" fill="#cc9922" font-size="11" font-family="Share Tech Mono">ZONE B</text>
        <text x="385" y="345" text-anchor="middle" fill="#cc9922" font-size="26" font-family="Rajdhani" font-weight="700">P</text>
      </g>

      <!-- Football Ground -->
      <g class="b" data-id="football" onclick="selB('football')" onmouseenter="showTip(event,'Football Ground')" onmouseleave="hideTip()">
        <rect class="bf" x="588" y="45" width="376" height="290" fill="#091a09" stroke="#22aa44" stroke-width="2" rx="4"/>
        <!-- Field markings -->
        <rect x="608" y="65" width="336" height="250" fill="none" stroke="#174a1f" stroke-width="1.5"/>
        <line x1="776" y1="65" x2="776" y2="315" stroke="#174a1f" stroke-width="1"/>
        <ellipse cx="776" cy="190" rx="55" ry="44" fill="none" stroke="#174a1f" stroke-width="1"/>
        <circle cx="776" cy="190" r="4" fill="#174a1f"/>
        <!-- Goals -->
        <rect x="608" y="163" width="22" height="54" fill="none" stroke="#22622a" stroke-width="1.5"/>
        <rect x="922" y="163" width="22" height="54" fill="none" stroke="#22622a" stroke-width="1.5"/>
        <text x="776" y="180" text-anchor="middle" fill="#22aa44" font-size="18" font-family="Rajdhani" font-weight="700">FOOTBALL</text>
        <text x="776" y="200" text-anchor="middle" fill="#22aa44" font-size="14" font-family="Rajdhani">GROUND</text>
        <text x="776" y="220" text-anchor="middle" fill="#174a1f" font-size="11" font-family="Share Tech Mono">⚽ Full-Size Field</text>
      </g>

      <!-- Cow Stay -->
      <g class="b" data-id="cow-stay" onclick="selB('cow-stay')" onmouseenter="showTip(event,'Gaushala – Cow Shed')" onmouseleave="hideTip()">
        <rect class="bf" x="592" y="347" width="72" height="50" fill="#251508" stroke="#aa6622" stroke-width="1.5" rx="2"/>
        <text x="628" y="368" text-anchor="middle" fill="#cc8844" font-size="9" font-family="Share Tech Mono">COW</text>
        <text x="628" y="382" text-anchor="middle" fill="#cc8844" font-size="9" font-family="Share Tech Mono">STAY</text>
      </g>

      <!-- Ground NE 1 -->
      <g class="b" data-id="ground-1" onclick="selB('ground-1')" onmouseenter="showTip(event,'Ground 1')" onmouseleave="hideTip()">
        <rect class="bf" x="985" y="155" width="145" height="180" fill="#091a09" stroke="#22aa44" stroke-width="1.5" stroke-dasharray="7,4" rx="3"/>
        <text x="1057" y="248" text-anchor="middle" fill="#22aa44" font-size="13" font-family="Rajdhani" font-weight="600">Ground 1</text>
      </g>

      <!-- Ground NE 2 -->
      <g class="b" data-id="ground-2" onclick="selB('ground-2')" onmouseenter="showTip(event,'Ground 2')" onmouseleave="hideTip()">
        <rect class="bf" x="1150" y="155" width="155" height="180" fill="#091a09" stroke="#22aa44" stroke-width="1.5" stroke-dasharray="7,4" rx="3"/>
        <text x="1228" y="248" text-anchor="middle" fill="#22aa44" font-size="13" font-family="Rajdhani" font-weight="600">Ground 2</text>
      </g>

      <!-- D-Block (Pharmacy) -->
      <g class="b" data-id="d-block" onclick="selB('d-block')" onmouseenter="showTip(event,'D-Block – Pharmacy')" onmouseleave="hideTip()">
        <rect class="bf" x="640" y="198" width="178" height="142" fill="#162506" stroke="#88cc44" stroke-width="2" rx="4"/>

let selId=null,navMode=false;
let vb={x:0,y:0,w:1620,h:800};
let drag=false,ds={x:0,y:0};
const svg=document.getElementById('cmap');
const mc=document.getElementById('mc');

function upVB(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}

function zIn(){const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;vb.w*=.8;vb.h*=.8;vb.x=cx-vb.w/2;vb.y=cy-vb.h/2;upVB()}
function zOut(){const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;vb.w=Math.min(vb.w*1.25,2600);vb.h=Math.min(vb.h*1.25,1300);vb.x=cx-vb.w/2;vb.y=cy-vb.h/2;upVB()}
function resetView(){vb={x:0,y:0,w:1620,h:800};upVB();closeSide()}

mc.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();const mx=(e.clientX-r.left)/r.width,my=(e.clientY-r.top)/r.height;const sx=vb.x+mx*vb.w,sy=vb.y+my*vb.h;const f=e.deltaY>0?1.1:.9;vb.w=Math.max(200,Math.min(vb.w*f,2800));vb.h=Math.max(100,Math.min(vb.h*f,1400));vb.x=sx-mx*vb.w;vb.y=sy-my*vb.h;upVB()},{passive:false});

svg.addEventListener('mousedown',e=>{if(e.target.closest('.b'))return;drag=true;ds={x:e.clientX,y:e.clientY}});
document.addEventListener('mousemove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();vb.x-=(e.clientX-ds.x)/(r.width/vb.w);vb.y-=(e.clientY-ds.y)/(r.height/vb.h);ds={x:e.clientX,y:e.clientY};upVB()});
document.addEventListener('mouseup',()=>drag=false);

// Touch
let ltd=0;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){ltd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}else if(e.touches.length===1){drag=true;ds={x:e.touches[0].clientX,y:e.touches[0].clientY}}});
svg.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);const f=ltd/d;const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;vb.w=Math.max(200,Math.min(vb.w*f,2800));vb.h=Math.max(100,Math.min(vb.h*f,1400));vb.x=cx-vb.w/2;vb.y=cy-vb.h/2;upVB();ltd=d}else if(e.touches.length===1&&drag){const r=svg.getBoundingClientRect();vb.x-=(e.touches[0].clientX-ds.x)/(r.width/vb.w);vb.y-=(e.touches[0].clientY-ds.y)/(r.height/vb.h);ds={x:e.touches[0].clientX,y:e.touches[0].clientY};upVB()}},{passive:false});
svg.addEventListener('touchend',()=>drag=false);

function showTip(e,txt){const tip=document.getElementById('tip'),cr=mc.getBoundingClientRect();tip.textContent=txt;tip.style.display='block';tip.style.left=(e.clientX-cr.left)+'px';tip.style.top=(e.clientY-cr.top)+'px'}
function hideTip(){document.getElementById('tip').style.display='none'}

function selB(id){
  if(selId){document.querySelector(`[data-id="${selId}"]`)?.classList.remove('sel')}
  selId=id;document.querySelector(`[data-id="${id}"]`)?.classList.add('sel');
  const b=BD[id];if(!b)return;
  const tclr={Academic:'#4488ff',Hostel:'#cc44aa',Sports:'#22aa44',Parking:'#cc9922',Security:'#cc3333',Amenity:'#8844cc','Campus Facility':'#cc8844','Open Area':'#22aa44','Academic Block':'#4488ff'};
  const c=tclr[b.type]||'#00c8ff';
  document.getElementById('sc').innerHTML=`
    <div style="position:relative;margin-bottom:4px">
      <button class="xbtn" onclick="closeSide()">✕</button>
    </div>
    <div class="bhead">
      <div class="bico" style="background:${b.bg};border:2px solid ${b.color}"><span>${b.icon}</span></div>
      <div class="bmeta">
        <h2>${b.name}</h2>
        <span class="badge" style="background:${b.bg};color:${b.color};border:1px solid ${b.color}">${b.type}</span>
      </div>
    </div>
    <p style="font-size:12px;color:var(--dim);line-height:1.65;margin-bottom:14px">${b.desc}</p>
    <div class="div"></div>
    <div class="is"><h3>Details</h3>
    ${b.det.map(d=>`<div class="ir"><span class="ico">${d.i}</span><span class="lbl">${d.l}</span><span style="color:#fff;font-size:12px">${d.v}</span></div>`).join('')}
    </div>
    <div class="is"><h3>Tags</h3><div class="tags">${b.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>
    <div class="div"></div>
    <button class="navbtn" onclick="goNavTo('${id}')">🧭 Navigate Here</button>`;
  document.getElementById('side').classList.add('open');
}

function closeSide(){document.getElementById('side').classList.remove('open');if(selId){document.querySelector(`[data-id="${selId}"]`)?.classList.remove('sel');selId=null}}

// Search
const sinp=document.getElementById('sinp'),sres=document.getElementById('sres');
sinp.addEventListener('input',function(){
  const q=this.value.toLowerCase().trim();
  if(!q){sres.style.display='none';clearHi();return}
  const res=Object.entries(BD).filter(([id,b])=>b.name.toLowerCase().includes(q)||b.type.toLowerCase().includes(q)||b.tags.some(t=>t.toLowerCase().includes(q)));
  sres.innerHTML=res.length?res.map(([id,b])=>`<div class="sri" onclick="hitSearch('${id}')"><span>${b.icon}</span><div><div style="color:#fff">${b.name}</div><div class="sri-sub">${b.type}</div></div></div>`).join(''):`<div class="sri" style="color:var(--dim)">No results</div>`;
  sres.style.display='block';
});
document.addEventListener('click',e=>{if(!e.target.closest('.sw'))sres.style.display='none'});
function hitSearch(id){sres.style.display='none';sinp.value=BD[id]?.name||'';clearHi();const el=document.querySelector(`[data-id="${id}"]`);if(el)el.classList.add('hi');selB(id);setTimeout(()=>el?.classList.remove('hi'),3000)}
function clearHi(){document.querySelectorAll('.hi').forEach(e=>e.classList.remove('hi'))}

// Navigate
function toggleNav(){
  navMode=!navMode;
  const btn=document.getElementById('navBtn'),np=document.getElementById('np');
  if(navMode){btn.classList.add('active');btn.textContent='✕ Close Nav';np.classList.add('show');popNavSel()}
  else{btn.classList.remove('active');btn.textContent='⇨ Navigate';np.classList.remove('show');clrRoute()}
}
function popNavSel(){
  const opts=Object.entries(BD).map(([id,b])=>`<option value="${id}">${b.icon} ${b.name}</option>`).join('');
  document.getElementById('nfrom').innerHTML=opts;
  document.getElementById('nto').innerHTML=opts;
  document.getElementById('nto').value='e-block';
}
function goNavTo(id){if(!navMode)toggleNav();document.getElementById('nto').value=id;if(selId&&selId!==id)document.getElementById('nfrom').value=selId}
function doRoute(){
  const f=document.getElementById('nfrom').value,t=document.getElementById('nto').value;
  if(f===t){document.getElementById('rinfo').textContent='Select different locations.';document.getElementById('rinfo').style.display='block';return}
  const fb=BD[f],tb=BD[t];
  const midY=395;
  const path=`M${fb.cx},${fb.cy} L${fb.cx},${midY} L${tb.cx},${midY} L${tb.cx},${tb.cy}`;
  const dist=Math.round(Math.sqrt(Math.pow(tb.cx-fb.cx,2)+Math.pow(tb.cy-fb.cy,2))*0.14);
  const rp=document.getElementById('rpath');rp.setAttribute('d',path);rp.setAttribute('opacity','1');
  const rs=document.getElementById('rmkS'),re=document.getElementById('rmkE');
  const rsl=document.getElementById('rmkSlbl'),rel=document.getElementById('rmkElbl');
  rs.setAttribute('cx',fb.cx);rs.setAttribute('cy',fb.cy);rs.setAttribute('opacity','1');
  rsl.setAttribute('x',fb.cx);rsl.setAttribute('y',fb.cy-14);rsl.setAttribute('opacity','1');
  re.setAttribute('cx',tb.cx);re.setAttribute('cy',tb.cy);re.setAttribute('opacity','1');
  rel.setAttribute('x',tb.cx);rel.setAttribute('y',tb.cy-14);rel.setAttribute('opacity','1');
  const ri=document.getElementById('rinfo');
  ri.innerHTML=`📍 ${fb.icon} ${fb.name}<br>→ ${tb.icon} ${tb.name}<br>Est. distance: ~${dist}m`;
  ri.style.display='block';
}
function clrRoute(){['rpath','rmkS','rmkE','rmkSlbl','rmkElbl'].forEach(id=>{document.getElementById(id)?.setAttribute('opacity','0')});document.getElementById('rinfo').style.display='none'}
</script>
